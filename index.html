<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prakiraan Cuaca</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .container {
            width: 80%;
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
            border: 1px solid #ddd;
            background-color: #f9f9f9;
            text-align: center;
            border-radius: 10px;
        }
        .table-container {
            width: 100%;
            margin-bottom: 20px;
        }
        .chart-container {
            width: 100%;
            text-align: center;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
            font-size: 12px;
        }
        th {
            background-color: #f4f4f4;
            font-weight: bold;
        }
        canvas {
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Prakiraan Cuaca</h1>
        <p>Lokasi: Lat -8.973, Lon 112.625</p>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Suhu Maksimum (°C)</th>
                        <th>Suhu Minimum (°C)</th>
                        <th>Presipitasi (mm)</th>
                        <th>Probabilitas Hujan (%)</th>
                    </tr>
                </thead>
                <tbody id="weatherData"></tbody>
            </table>
        </div>
        <div class="chart-container">
            <canvas id="weatherChart"></canvas>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
